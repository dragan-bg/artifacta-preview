name: Deploy ARTIFACTA compiled preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore verified Retail Concepts images
        run: |
          cat encoded/retail-concepts-hero/*.b64 | base64 -d > site/custom/retail-concepts-hero.webp
          cat encoded/retail-concepts-overview/*.b64 | base64 -d > site/custom/retail-concepts-overview.webp
          file site/custom/retail-concepts-hero.webp
          file site/custom/retail-concepts-overview.webp
          test -s site/custom/retail-concepts-hero.webp
          test -s site/custom/retail-concepts-overview.webp

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
