name: Deploy clean Axial preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  mirror-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Mirror clean Axial demo
        run: |
          rm -rf mirror site
          mkdir -p mirror site
          wget             --mirror             --page-requisites             --convert-links             --adjust-extension             --no-parent             --execute robots=off             --user-agent="Mozilla/5.0"             https://axial-theme.pages.dev/             -P mirror
          cp -a mirror/axial-theme.pages.dev/. site/
          touch site/.nojekyll

      - name: Verify mirrored homepage
        run: |
          test -f site/index.html
          test -d site/_astro
          echo "Axial clean mirror ready"
          find site -maxdepth 2 -type f | head -50

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload clean Axial site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
