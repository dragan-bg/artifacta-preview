name: Deploy ARTIFACTA preview

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  mirror-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Mirror clean Axial demo
        run: |
          rm -rf mirror site
          mkdir -p mirror site
          wget             --mirror             --page-requisites             --convert-links             --adjust-extension             --no-parent             --execute robots=off             --user-agent="Mozilla/5.0"             https://axial-theme.pages.dev/             -P mirror
          cp -a mirror/axial-theme.pages.dev/. site/
          touch site/.nojekyll

      - name: Copy original ARTIFACTA hero video
        run: |
          mkdir -p site/videos
          cp videos/artifacta_hero_loop_v1.mp4 site/videos/artifacta_hero_loop_v1.mp4
          cmp videos/artifacta_hero_loop_v1.mp4 site/videos/artifacta_hero_loop_v1.mp4

      - name: Replace Axial hero with ARTIFACTA hero
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          new_video = "/artifacta-preview/videos/artifacta_hero_loop_v1.mp4"

          replacements = 0
          for path in Path("site").rglob("*.html"):
              text = path.read_text(encoding="utf-8", errors="ignore")
              original = text

              # wget converts the original absolute Axial asset URLs into local
              # relative paths, so replace by filename rather than exact URL.
              text = re.sub(
                  r'[^"\']*agency-hero-motion-v3\.mp4',
                  new_video,
                  text,
              )

              if text != original:
                  replacements += 1
                  path.write_text(text, encoding="utf-8")

          print(f"Updated hero assets in {replacements} HTML file(s)")
          if replacements == 0:
              raise SystemExit("No Axial hero asset references were found")
          PY

      - name: Verify preview
        run: |
          test -f site/index.html
          cmp videos/artifacta_hero_loop_v1.mp4 site/videos/artifacta_hero_loop_v1.mp4
          grep -q "artifacta_hero_loop_v1.mp4" site/index.html
          echo "ARTIFACTA hero replacement ready"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
